name: Build Badzy

# Builds Badzy.exe and nothing else: no installer, no tests, no zip, no
# release. The result is the plain exe, downloadable from the run page.
# Releases are made by hand.
#
# Speed: ordinary pushes use the quick "ci" profile (Cargo.toml). Put [full]
# in the commit message (or tick "full" on a manual run) for the fully
# optimised release profile, which takes much longer.

on:
  push:
    # a tag or release made by hand never starts a build
    tags-ignore:
      - "**"
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "assets/**"
  workflow_dispatch:
    inputs:
      full:
        description: "Full release optimisation (slower build)"
        type: boolean
        default: false

permissions:
  contents: read

# a newer push to the same branch replaces a running build
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # the cache is saved by every branch's first build, so builds after
          # a change in Cargo.lock start from the dependencies already built
          cache-on-failure: true
      - name: Pick the build profile
        shell: pwsh
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          $full = ("${{ inputs.full }}" -eq "true") -or ($env:COMMIT_MESSAGE -match '\[full\]')
          $profile = if ($full) { "release" } else { "ci" }
          Write-Host "Build profile: $profile"
          "PROFILE=$profile" | Out-File -Append $env:GITHUB_ENV
      - name: Build
        run: cargo build --profile $env:PROFILE -p swiftget
      # the exe itself, not zipped
      - uses: actions/upload-artifact@v7
        with:
          path: target/${{ env.PROFILE }}/Badzy.exe
          archive: false
          if-no-files-found: error
