<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
<defs>
  <linearGradient id="face" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1d1d27"/><stop offset="1" stop-color="#0a0a10"/></linearGradient>
  <linearGradient id="back" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#15151d"/><stop offset="1" stop-color="#07070b"/></linearGradient>
  <linearGradient id="ring" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#f20b36" stop-opacity=".15"/><stop offset=".5" stop-color="#ff4d6a"/><stop offset="1" stop-color="#f20b36" stop-opacity=".9"/></linearGradient>
  <filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="14"/></filter>
</defs>
<!-- red light behind the folder -->
<ellipse cx="256" cy="300" rx="170" ry="130" fill="#f20b36" opacity=".22" filter="url(#soft)"/>
<!-- orbit ring: the back half first -->
<g transform="rotate(-16 256 300)" fill="none" stroke="url(#ring)" stroke-width="5" filter="url(#glow)">
  <path d="M40 300 A216 78 0 0 1 472 300"/></g>
<!-- the folder -->
<path d="M120 142 Q120 122 140 122 H220 Q234 122 242 134 L252 148 H372 Q392 148 392 168 V360 Q392 380 372 380 H140 Q120 380 120 360 Z" fill="url(#back)" stroke="#f20b36" stroke-opacity=".55" stroke-width="2.5"/>
<rect x="104" y="172" width="304" height="228" rx="22" fill="url(#face)" stroke="#f20b36" stroke-width="3" filter="url(#glow)"/>
<rect x="110" y="178" width="292" height="216" rx="17" fill="none" stroke="#ffffff" stroke-opacity=".07" stroke-width="2"/>
<!-- the front half of the ring crosses over the folder -->
<g transform="rotate(-16 256 300)" fill="none" stroke="url(#ring)" stroke-width="6" filter="url(#glow)">
  <path d="M40 300 A216 78 0 0 0 472 300"/></g>
<g filter="url(#glow)" transform="translate(-12 4)"><g fill="#f20b36"><rect x="251" y="206" width="10" height="150" rx="3" opacity=".35"/>
      <rect x="262" y="212" width="12" height="8" rx="2"/><rect x="240" y="226" width="12" height="8" rx="2"/><rect x="262" y="240" width="12" height="8" rx="2"/><rect x="240" y="254" width="12" height="8" rx="2"/><rect x="262" y="268" width="12" height="8" rx="2"/><rect x="240" y="282" width="12" height="8" rx="2"/><rect x="262" y="296" width="12" height="8" rx="2"/><rect x="240" y="310" width="12" height="8" rx="2"/><rect x="262" y="324" width="12" height="8" rx="2"/><rect x="240" y="338" width="12" height="8" rx="2"/>
      <rect x="241" y="330" width="30" height="40" rx="8" fill="none" stroke="#ff4d6a" stroke-width="5"/></g></g>
</svg>
