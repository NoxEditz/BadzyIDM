[package]
name = "badzy-shell"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Badzy desktop shell: hosts the web UI in WebView2"
build = "build.rs"

[[bin]]
name = "Badzy-Web"
path = "src/main.rs"

[target.'cfg(windows)'.dependencies]
wry = "0.57"
tao = "0.37"
include_dir = "0.7"
serde_json.workspace = true
mime_guess = "2"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
