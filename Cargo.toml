[workspace]
resolver = "2"
members = ["crates/engine", "crates/app"]

[workspace.package]
version = "2.0.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "fs", "io-util"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

# The build that CI makes for ordinary pushes (so a test build is ready in
# minutes, not a quarter of an hour): the same code with less optimisation
# work. Releases and "[full]" commits use the full release profile above.
[profile.ci]
inherits = "release"
opt-level = 2
lto = false
codegen-units = 16
